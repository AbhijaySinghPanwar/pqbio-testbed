crypto:
  mode: pq                  # classical | pq
  kem: ML-KEM-768
  sig: ML-DSA-65

binding:
  nonce_bytes: 32
  challenge_ttl_s: 30
  clock_skew_s: 2
  illumination_steps: 4
  illumination_corr_min: 0.70
  # Both calibrated by scripts/measure_phash_burst_calibration.py — see
  # PROJECT_SPEC.md §14 for the full reasoning and the honest limitation it found.
  phash_hamming_max: 10       # D: per-frame distance floor that still catches every
                               # re-encode/rescale/crop case in the robustness sweep
  phash_reuse_min_frames: 30  # N: frames of the burst that must each match within D
                               # before BIND_EVIDENCE_REUSE fires (out of capture.n_frames)

capture:
  n_frames: 30
  fps: 15
  resolution: [1280, 720]

detect:
  quality: {min_face_px: 112, min_blur_var: 60.0, max_yaw_deg: 25}
  thresholds:               # set by calibration, not by hand
    pad: 0.50
    morph: 0.50
    deepfake: 0.50
    replay: 0.50
    injection: 0.40
    match_cosine_min: 0.38
  fusion:
    strategy: cascade       # rule | cascade
    operating_point: bpcer_at_apcer_5

server:
  workers: 4
  max_concurrency: 64
  request_timeout_s: 10
