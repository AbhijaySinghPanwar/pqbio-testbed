crypto:
  mode: pq                  # classical | pq
  kem: ML-KEM-768
  sig: ML-DSA-65

binding:
  nonce_bytes: 32
  challenge_ttl_s: 30
  clock_skew_s: 2
  illumination_steps: 4
  # INTERIM, and the number is a coincidence -- it was 0.70 before too, but that value was
  # set against a formulation that no longer exists (absolute per-channel brightness
  # correlated against raw palette RGB). Re-derived 2026-09-02 by
  # scripts/calibrate_illumination_corr.py from 24 real captures plus 192 wrong-nonce and
  # 200 synthetic negatives -> results/illumination_corr_calibration.json.
  #
  # 0.70 is the lowest round value above the measured zero-false-accept floor of 0.688;
  # the worst wrong-nonce negative scored 0.673, so the margin below is +0.027. There is
  # no comparable margin above: measured TPR is 0.33 across all capture conditions
  # (0.67 in the best one). B6 will false-reject genuine captures at this setting.
  #
  # That is a property of `illumination_steps: 4`, not of this threshold. B6's
  # correlation has ~`illumination_steps` effective samples per channel regardless of
  # frame count, so 4 steps leave the null distribution far too wide. Re-running the live
  # check at 16 steps drops the wrong-nonce tail from max 0.673 to 0.360
  # (results/illumination_corr_calibration_16step.json), which would support a threshold
  # near 0.40 with much better TPR. Raise the step count before lowering this.
  illumination_corr_min: 0.70
  # Both calibrated by scripts/measure_phash_burst_calibration.py — see
  # PROJECT_SPEC.md §14 for the full reasoning and the honest limitation it found.
  phash_hamming_max: 10       # D: per-frame distance floor that still catches every
                               # re-encode/rescale/crop case in the robustness sweep
  phash_reuse_min_frames: 30  # N: frames of the burst that must each match within D
                               # before BIND_EVIDENCE_REUSE fires (out of capture.n_frames)

capture:
  n_frames: 30
  fps: 15
  resolution: [1280, 720]
  # Illumination-challenge measurement (§5.2). Chromaticity is luminance-normalised by
  # definition; these govern how that normalisation is taken. See
  # scripts/calibrate_illumination_corr.py and PROJECT_SPEC.md §14 (2026-09-02).
  illumination_region_weighting: uniform  # "uniform" | "centre" -- chosen on measured
                                          # separation, not preference; see §14
  illumination_min_channel_sum: 12.0      # mean R+G+B (0-765) below which a region has
                                          # no usable hue and reads neutral (1/3,1/3,1/3)
  illumination_centre_grid: 4             # cells per axis for the "centre" weighting

detect:
  quality: {min_face_px: 112, min_blur_var: 60.0, max_yaw_deg: 25}
  thresholds:               # set by calibration, not by hand
    pad: 0.50
    morph: 0.50
    deepfake: 0.50
    replay: 0.50
    injection: 0.40
    match_cosine_min: 0.38
  fusion:
    strategy: cascade       # rule | cascade
    operating_point: bpcer_at_apcer_5

server:
  workers: 4
  max_concurrency: 64
  request_timeout_s: 10
