crypto:
  mode: pq                  # classical | pq
  kem: ML-KEM-768
  sig: ML-DSA-65

binding:
  nonce_bytes: 32
  challenge_ttl_s: 30
  clock_skew_s: 2
  # 12 steps at 200 ms = 2.4 s of capture. Both re-derived 2026-09-03 by
  # scripts/b6_operating_point.py -> results/b6_operating_point.json, which sweeps the
  # step count against real captures and reports TPR/FAR across a full threshold sweep.
  #
  # Why 12 and not 4: B6's correlation has ~illumination_steps effective samples per
  # channel, so the step count -- not the frame count, not the threshold -- sets its noise
  # floor. At 4 steps the genuine and wrong-nonce classes OVERLAP by 0.100: no threshold
  # separates them. At 12 they separate with room on both sides. 16 is marginally better
  # (+0.143 vs +0.133 minimum margin) but that gap is inside the measurement's own
  # standard error (~0.02 on 8 captures) while costing another 0.8 s of capture, so the
  # cheaper option wins; the selection rule is recorded in the JSON.
  illumination_steps: 12
  illumination_step_ms: 200   # was a hardcoded 0.2s default in
                              # render_challenge_fullscreen -- a magic number, and the
                              # one the capture frame budget has to cover
  # 0.60 = the midpoint of the measured gap for the deployed capture protocol (WB locked,
  # AE auto) at 12 steps under `uniform` weighting: worst negative 0.472, lowest genuine
  # capture 0.748. Margin below +0.128, margin above +0.148, TPR 1.00, FAR 0.0000.
  #
  # Calibrated STRICT ON TPR and permissive on FAR, which is the inverse of the 2026-09-02
  # derivation and the correction this value exists to record. B6 is one of six ANDed
  # binding checks: ANDing compounds false rejects and suppresses false accepts, so a link
  # in that chain must not be tuned to FAR=0 at any TPR cost. B1-B5 are deterministic, so
  # B6 carries the entire system BPCER budget of §8.1 and its required TPR is the system
  # target itself (0.95 for 5%), not the sixth root of it.
  #
  # Honest limits, both of them. (1) TPR 1.00 on 8 captures does NOT demonstrate 5%
  # BPCER: the 95% Clopper-Pearson upper bound here is 0.312, and showing 5% needs ~59
  # clean captures. (2) Those margins come from ONE sitting. Re-running an hour later
  # with the room lights on gave +0.077 +/- 0.455 for the same condition that had given
  # +0.775 +/- 0.035, because the screen contributes only ~1.5% of scene light there and
  # auto-exposure clips 9-10% of pixels. 0.60 is the best available estimate on weak
  # evidence, not a characterised operating point. See §14 (2026-09-03, both entries).
  illumination_corr_min: 0.60
  # Evaluability floor (2026-09-04). B6 must first ask whether a capture CAN measure the
  # challenge before asking whether it did -- below this, the per-channel standard
  # deviation of the chromaticity trace is at the sensor's noise level and the
  # correlation is a meaningless number that would be thresholded as if it meant
  # something, rejecting a genuine user as an attacker.
  #
  # Derived from 166 rendered captures already held (scripts/derive_b6_evaluability.py ->
  # results/b6_evaluability.json). At 0.0015: ZERO of the 97 captures that passed the
  # correlation are gated, with the lowest-spread passing capture at 0.00226 -- a margin
  # of +0.00076, 51% of the floor. It reclassifies 33% of failing rendered captures from
  # "attack" to "retry", and gates 74% of no-render controls.
  #
  # Two other candidates were measured and DROPPED, see §14: clipping fraction (the two
  # clipped captures both PASSED, at r=+0.785/+0.753) and screen-contribution fraction
  # (usable 0.0122-0.0171 vs unusable 0.0163-0.0183 -- overlapping and inverted).
  illumination_min_trace_spread: 0.0015
  # Both calibrated by scripts/measure_phash_burst_calibration.py — see
  # PROJECT_SPEC.md §14 for the full reasoning and the honest limitation it found.
  phash_hamming_max: 10       # D: per-frame distance floor that still catches every
                               # re-encode/rescale/crop case in the robustness sweep
  phash_reuse_min_frames: 30  # N: frames of the burst that must each match within D
                               # before BIND_EVIDENCE_REUSE fires (out of capture.n_frames)

capture:
  # 48 @ 20 fps = 2.4 s, which is exactly what 12 steps x 200 ms needs, at 4 frames per
  # step. Costs measured by scripts/measure_frame_budget.py -> results/frame_budget.json:
  # +92 ms of server-side per-frame work (pHash + capture_binding) against the ~700 ms of
  # ONNX inference already in a request, and a 10.86 MiB bundle against 6.79 MiB.
  # 36 @ 15 fps would also give 2.4 s for +20 ms, but at 3 frames/step with zero slack --
  # and after the ~60 ms panel/sensor settle each step, only ~2 of those frames are
  # usable. Under-sampling steps is what put B6 in this state; paying 72 ms to avoid it
  # is the right trade.
  n_frames: 48
  fps: 20
  resolution: [1280, 720]
  # Illumination-challenge measurement (§5.2). Chromaticity is luminance-normalised by
  # definition; these govern how that normalisation is taken. See
  # scripts/calibrate_illumination_corr.py and PROJECT_SPEC.md §14 (2026-09-02).
  illumination_region_weighting: uniform  # "uniform" | "centre" -- chosen on measured
                                          # separation, not preference; see §14
  illumination_min_channel_sum: 12.0      # mean R+G+B (0-765) below which a region has
                                          # no usable hue and reads neutral (1/3,1/3,1/3)
  illumination_centre_grid: 4             # cells per axis for the "centre" weighting

detect:
  quality: {min_face_px: 112, min_blur_var: 60.0, max_yaw_deg: 25}
  thresholds:               # set by calibration, not by hand
    pad: 0.50
    morph: 0.50
    deepfake: 0.50
    replay: 0.50
    injection: 0.40
    match_cosine_min: 0.38
  fusion:
    strategy: cascade       # rule | cascade
    operating_point: bpcer_at_apcer_5
  morph:
    # Minimum verifying test-split morphs before a verifying-subset detection figure is
    # reported rather than BLOCKED with its count. At 30 attacks the 95% Clopper-Pearson
    # interval on an APCER near 0.5 is roughly +/-0.19 -- already wide; below that the
    # interval is wider than the differences the table exists to show.
    min_verifying_attacks_reported: 30

server:
  workers: 4
  max_concurrency: 64
  request_timeout_s: 10
