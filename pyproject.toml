[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pq-bio-auth"
version = "0.1.0"
description = "AI-based biometric evidence authentication for post-quantum digital identity systems"
requires-python = "==3.11.*"
readme = "README.md"

# --- core: crypto, protocol, server ---------------------------------------------------
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "cbor2>=5.6",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "structlog>=24.1",
    # Documented liboqs fallback (see pqbio/pqc/kem.py docstring) — pure-Python FIPS
    # 203/204 reference implementations, used as the live backend when liboqs cannot be
    # built (no C toolchain on PATH).
    "kyber-py>=1.0",
    "dilithium-py>=1.0",
    # Module B (pqbio/capture/) — camera/replay frame sources, JPEG encoding, and the
    # illumination-challenge chromaticity measurement all import cv2/numpy directly at
    # module load, so these are core, not the optional "ml" extra below.
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Primary PQC backend per §4. Requires cmake, ninja, and a C compiler on PATH — its
# install script clones and CMake-builds liboqs automatically. Not installed by default
# because this dev environment lacks a usable C++ toolchain (see pqbio/pqc/kem.py).
# Pinned exactly (not >=): this is the version verified during scaffolding (round-trip
# and artefact-size checks against a probe install) — bump deliberately, not implicitly.
pqc-liboqs = ["liboqs-python==0.16.0"]

ml = [
    "torch>=2.2",
    "timm>=0.9",
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "scikit-image>=0.22",
    "imagehash>=4.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "psutil>=5.9",
    "pynvml>=11.5",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "black>=24.2",
    "mypy>=1.9",
    "httpx>=0.27",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["pqbio*"]

# --- formatting / linting ---------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.isort]
known-first-party = ["pqbio"]

# --- typing ------------------------------------------------------------------------------
# mypy --strict is required on pqc/, binding/, server/ (§11); other packages are still
# under active development and are checked non-strictly so scaffolding doesn't fail CI.

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pqbio.pqc.*", "pqbio.binding.*", "pqbio.server.*"]
strict = true

[[tool.mypy.overrides]]
module = ["kyber_py.*", "dilithium_py.*", "oqs.*", "cbor2.*", "insightface.*", "imagehash.*"]
ignore_missing_imports = true

# --- tests -------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pqbio"]
