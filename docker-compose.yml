# NOTE: not run-verified in the environment this scaffold was written in — no Docker
# engine is available there. See CLAUDE.md "current state": pqbio/server/app.py is still
# a placeholder (Module E), so `server` will build but has no real endpoints yet.
#
# State (nonce cache, keystore, pHash index, audit log) is SQLite per PROJECT_SPEC.md
# §4 — no separate cache/queue service. If a future revision needs one, add it back as
# its own service rather than reintroducing Redis without checking the spec first (it
# was deliberately removed — see PROJECT_SPEC.md's Amendments section).

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
